<rect x="201.6" y="78.8" width="198.9" height="271.2" fill="#dde2f3"/>
<line x1="400.5" y1="78.8" x2="400.5" y2="350.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="9 8"/>
<line x1="798.4" y1="78.8" x2="798.4" y2="350.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="9 8"/>
<line x1="201.6" y1="78.8" x2="798.4" y2="78.8" stroke="#1f56a8" stroke-width="6"/>
