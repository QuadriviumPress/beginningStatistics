<title id="title">Figure 2.16 The empirical rule</title>
<desc id="desc">A bell curve with vertical lines at one, two, and three standard deviations on each side of the mean. About 68% of the data lie between x̄ − s and x̄ + s (μ − σ and μ + σ), about 95% between x̄ − 2s and x̄ + 2s, and about 99.7% between x̄ − 3s and x̄ + 3s.</desc>
