<title id="title">Figure 1.1 The grand picture of statistics</title>
<desc id="desc">A population drawn as a grid of 64 circles, nine of them filled, with an arrow to a sample of those nine. Arrows lead from the sample to its data (x₁, x₂, …, xₙ) and from the data to statistics x̄, s², s, and p̂, which point back to the population parameters μ, σ², σ, and p that they estimate.</desc>
