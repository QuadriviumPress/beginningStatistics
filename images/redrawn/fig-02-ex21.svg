<title id="title">Example 21: data within and outside x̄ ± 2s</title>
<desc id="desc">Two copies of a lopsided curve for a sample with mean 28 and standard deviation 3, marked at 19, 22, 25, 28, 31, 34, and 37. (a) Only the part between 22 and 34 is drawn: at least 75%, so at least 38 of the 50 observations. (b) Only the parts outside that interval are drawn: at most 25%, so at most 12 observations.</desc>
