<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','Times New Roman',Times,'Liberation Serif',serif">
<title id="title">Figure 3.3 Sample spaces and probability</title>
<desc id="desc">A sample space S drawn as a rectangle containing outcomes e₁, e₂, e₃, e₄, e₅, and more, each tagged with its probability p₁, p₂, …. For the events A = {e₁, e₂} and B = {e₂, e₃, e₄}, P(A) = p₁ + p₂ and P(B) = p₂ + p₃ + p₄.</desc>
<rect width="1000" height="400" fill="#fff"/>
<rect x="90.0" y="90.0" width="350.0" height="230.0" fill="none" stroke="#8c8c8c" stroke-width="4"/>
<text x="30.0" y="215.0" font-size="34" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">S</tspan><tspan font-size="34.0"> :</tspan></text>
<line x1="150.0" y1="45.0" x2="150.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="30.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">p</tspan><tspan dy="9.6" font-size="22.4">1</tspan></text>
<line x1="255.0" y1="45.0" x2="255.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="255.0" y="30.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">p</tspan><tspan dy="9.6" font-size="22.4">2</tspan></text>
<line x1="360.0" y1="45.0" x2="360.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360.0" y="30.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">p</tspan><tspan dy="9.6" font-size="22.4">3</tspan></text>
<line x1="150.0" y1="300.0" x2="150.0" y2="365.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="395.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">p</tspan><tspan dy="9.6" font-size="22.4">4</tspan></text>
<line x1="255.0" y1="300.0" x2="255.0" y2="365.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="255.0" y="395.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">p</tspan><tspan dy="9.6" font-size="22.4">5</tspan></text>
<circle cx="135.0" cy="160.0" r="2.6" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="145.0" y="169.0" font-size="30" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">e</tspan><tspan dy="9.0" font-size="21.0">1</tspan></text>
<circle cx="240.0" cy="160.0" r="2.6" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="250.0" y="169.0" font-size="30" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">e</tspan><tspan dy="9.0" font-size="21.0">2</tspan></text>
<circle cx="345.0" cy="160.0" r="2.6" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="355.0" y="169.0" font-size="30" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">e</tspan><tspan dy="9.0" font-size="21.0">3</tspan></text>
<circle cx="135.0" cy="265.0" r="2.6" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="145.0" y="274.0" font-size="30" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">e</tspan><tspan dy="9.0" font-size="21.0">4</tspan></text>
<circle cx="240.0" cy="265.0" r="2.6" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="250.0" y="274.0" font-size="30" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">e</tspan><tspan dy="9.0" font-size="21.0">5</tspan></text>
<text x="380.0" y="270.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0">⋯</tspan></text>
