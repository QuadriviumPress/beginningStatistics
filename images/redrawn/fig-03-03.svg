<text x="620.0" y="70.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0">{</tspan><tspan font-size="34.0" font-style="italic">e</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0">, </tspan><tspan font-size="34.0" font-style="italic">e</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">}</tspan></text>
<text x="590.0" y="115.0" font-size="34" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">B</tspan><tspan font-size="34.0"> :</tspan></text>
<text x="620.0" y="115.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0">{</tspan><tspan font-size="34.0" font-style="italic">e</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">, </tspan><tspan font-size="34.0" font-style="italic">e</tspan><tspan dy="10.2" font-size="23.8">3</tspan><tspan dy="-10.2" font-size="34.0">, </tspan><tspan font-size="34.0" font-style="italic">e</tspan><tspan dy="10.2" font-size="23.8">4</tspan><tspan dy="-10.2" font-size="34.0">}</tspan></text>
<text x="590.0" y="235.0" font-size="34" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">A</tspan><tspan font-size="34.0">)</tspan></text>
<text x="620.0" y="235.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0">=   </tspan><tspan font-size="34.0" font-style="italic">p</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0"> + </tspan><tspan font-size="34.0" font-style="italic">p</tspan><tspan dy="10.2" font-size="23.8">2</tspan></text>
<text x="590.0" y="280.0" font-size="34" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">B</tspan><tspan font-size="34.0">)</tspan></text>
<text x="620.0" y="280.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0">=   </tspan><tspan font-size="34.0" font-style="italic">p</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0"> + </tspan><tspan font-size="34.0" font-style="italic">p</tspan><tspan dy="10.2" font-size="23.8">3</tspan><tspan dy="-10.2" font-size="34.0"> + </tspan><tspan font-size="34.0" font-style="italic">p</tspan><tspan dy="10.2" font-size="23.8">4</tspan></text>
</svg>
