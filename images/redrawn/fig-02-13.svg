<circle cx="930.0" cy="200.0" r="7.0" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="930.0" y="248.0" font-size="32" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="32.0" font-style="italic">x</tspan><tspan dy="9.6" font-size="22.4">max</tspan></text>
</svg>
