<title id="title">Figure 6.2 Distributions of the sample mean</title>
<desc id="desc">Probability histograms of the sample mean of n draws from a population of 0s and 1s in equal proportion, each on its own scale from 0 to 1, for n = 1, 5, 10, and 20. For n = 1 there are two equal bars; as n grows the histogram becomes a narrower, taller bell centered at 0.5.</desc>
