<title id="title">Figure 2.14 x-scale versus z-score</title>
<desc id="desc">A bell curve over two aligned scales. On the x scale the marks are μ − 3σ, μ − 2σ, μ − σ, μ, μ + σ, μ + 2σ, and μ + 3σ; on the z scale below, the same marks are −3, −2, −1, 0, 1, 2, and 3.</desc>
