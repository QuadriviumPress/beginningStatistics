<title id="title">Figure 2.8 Skewness of relative frequency histograms</title>
<desc id="desc">Four relative frequency curves. (a) A symmetric bell curve and (b) a symmetric two-humped curve, each with mean equal to median. (c) A curve skewed right, with a long right tail, has its mean to the right of its median. (d) A curve skewed left has its mean to the left of its median.</desc>
