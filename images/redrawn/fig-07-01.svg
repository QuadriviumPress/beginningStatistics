<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','Times New Roman',Times,'Liberation Serif',serif">
<title id="title">Figure 7.1 When winged dots capture the population mean</title>
<desc id="desc">Two intervals x̄ − E to x̄ + E drawn as winged dots above an axis marked μ − E, μ, and μ + E. The red interval, whose x̄ lies farther than E from μ, does not reach μ. The blue interval, whose x̄ lies within E of μ, contains μ.</desc>
<rect width="1000" height="340" fill="#fff"/>
<line x1="82.0" y1="95.0" x2="462.0" y2="95.0" stroke="#d9262c" stroke-width="2.5"/>
<line x1="82.0" y1="81.0" x2="82.0" y2="109.0" stroke="#d9262c" stroke-width="5.0"/>
<line x1="462.0" y1="81.0" x2="462.0" y2="109.0" stroke="#d9262c" stroke-width="5.0"/>
<circle cx="272.0" cy="95.0" r="8" fill="#d9262c"/>
<text x="82.0" y="65.0" font-size="30" text-anchor="middle" fill="#d9262c" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan><tspan font-size="30.0"> − </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
<text x="272.0" y="65.0" font-size="30" text-anchor="middle" fill="#d9262c" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan></text>
<text x="462.0" y="65.0" font-size="30" text-anchor="middle" fill="#d9262c" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan><tspan font-size="30.0"> + </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
<line x1="349.9" y1="190.0" x2="729.9" y2="190.0" stroke="#1f56a8" stroke-width="2.5"/>
<line x1="349.9" y1="176.0" x2="349.9" y2="204.0" stroke="#1f56a8" stroke-width="5.0"/>
<line x1="729.9" y1="176.0" x2="729.9" y2="204.0" stroke="#1f56a8" stroke-width="5.0"/>
<circle cx="539.9" cy="190.0" r="8" fill="#1f56a8"/>
<text x="349.9" y="160.0" font-size="30" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan><tspan font-size="30.0"> − </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
<text x="539.9" y="160.0" font-size="30" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan></text>
<text x="729.9" y="160.0" font-size="30" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="30.0" font-style="italic">x̄</tspan><tspan font-size="30.0"> + </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
<line x1="30.0" y1="270.0" x2="970.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="310.0" y1="262.0" x2="310.0" y2="278.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="310.0" y="314.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">μ</tspan><tspan font-size="30.0"> − </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
<line x1="500.0" y1="262.0" x2="500.0" y2="278.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="500.0" y="314.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">μ</tspan></text>
<line x1="690.0" y1="262.0" x2="690.0" y2="278.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="690.0" y="314.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">μ</tspan><tspan font-size="30.0"> + </tspan><tspan font-size="30.0" font-style="italic">E</tspan></text>
</svg>
