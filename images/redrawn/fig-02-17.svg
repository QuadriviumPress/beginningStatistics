<title id="title">Figure 2.17 Distribution of heights</title>
<desc id="desc">A bell curve of heights with vertical lines at μ − 2σ = 66.9, μ − σ = 68.2, μ + σ = 71.0, and μ + 2σ = 72.4, around μ = 69.6. About 68% of heights lie between 68.2 and 71.0, and about 95% between 66.9 and 72.4.</desc>
