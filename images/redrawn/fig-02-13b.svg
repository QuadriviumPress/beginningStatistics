<line x1="70.0" y1="30.0" x2="70.0" y2="130.0" stroke="#1a1a1a" stroke-width="2"/>
<line x1="930.0" y1="30.0" x2="930.0" y2="130.0" stroke="#1a1a1a" stroke-width="2"/>
<line x1="70.0" y1="80.0" x2="238.0" y2="80.0" stroke="#1a1a1a" stroke-width="2"/>
<line x1="709.2" y1="80.0" x2="930.0" y2="80.0" stroke="#1a1a1a" stroke-width="2"/>
<rect x="238.0" y="40.0" width="471.2" height="80.0" fill="none" stroke="#1a1a1a" stroke-width="2"/>
