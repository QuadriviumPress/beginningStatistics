<circle cx="475.3" cy="200.0" r="7.0" fill="#1a1a1a" stroke="none" stroke-width="0"/>
<text x="475.3" y="248.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0">2.62</tspan></text>
<circle cx="709.2" cy="200.0" r="7.0" fill="#1a1a1a" stroke="none" stroke-width="0"/>
