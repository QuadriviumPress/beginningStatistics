<title id="title">Figure 2.5 Sample size and relative frequency histograms</title>
<desc id="desc">Four panels. (a) A small sample gives a histogram with four wide, uneven bars. (b) A medium sample gives ten narrower, still irregular bars. (c) A large sample gives many thin bars that trace a smooth bell shape. (d) A very large sample is represented by the smooth bell-shaped curve itself.</desc>
