<title id="title">Figure 11.7 Many F-distributions</title>
<desc id="desc">F density curves for degrees of freedom (1, 1), (10, 20), and (5, 4) on a horizontal axis from 0 to 5. The (1, 1) curve is highest at 0 and decreases slowly; the (10, 20) curve has a tall peak near 1; the (5, 4) curve peaks lower, closer to 0, and has a heavier right tail.</desc>
