<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','Times New Roman',Times,'Liberation Serif',serif">
<title id="title">Figure 2.18 Distribution of IQ scores</title>
<desc id="desc">Two bell curves of IQ scores with mean 100 and standard deviation 10, marked at 70, 80, 90, 100, 110, 120, and 130. (a) Whole spectrum: about 68% of scores lie between 90 and 110, 95% between 80 and 120, and 99.7% between 70 and 130. (b) Higher end: about 16% of scores lie above 110, 2.5% above 120, and 0.15% above 130.</desc>
