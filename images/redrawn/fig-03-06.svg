<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','Times New Roman',Times,'Liberation Serif',serif">
<title id="title">Figure 3.6 Tree diagram for drawing two marbles</title>
<desc id="desc">Tree diagram for drawing two marbles without replacement from a jar of 7 black (B) and 3 white (W). The first draw is B with probability 7/10 or W with probability 3/10; after B, the second is B with probability 6/9 or W with 3/9; after W, B with 7/9 or W with 2/9. The path probabilities are P(B₁ ∩ B₂) = 0.47, P(B₁ ∩ W₂) = 0.23, P(W₁ ∩ B₂) = 0.23, and P(W₁ ∩ W₂) = 0.07. The two-blue outcome is circled and the two mixed outcomes are boxed together.</desc>
<rect width="1000" height="560" fill="#fff"/>
<line x1="20.0" y1="280.0" x2="150.0" y2="134.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="80.0" y="208.0" font-size="24" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">7/10</tspan></text>
<text x="175.0" y="136.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">B</tspan></text>
<line x1="200.0" y1="120.0" x2="300.0" y2="30.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="250.0" y="74.0" font-size="24" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">6/9</tspan></text>
<text x="330.0" y="46.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">B</tspan></text>
<line x1="200.0" y1="120.0" x2="300.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="250.0" y="154.0" font-size="24" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">3/9</tspan></text>
<text x="330.0" y="206.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">W</tspan></text>
<line x1="20.0" y1="280.0" x2="150.0" y2="416.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="80.0" y="368.0" font-size="24" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">3/10</tspan></text>
<text x="175.0" y="456.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">W</tspan></text>
<line x1="200.0" y1="440.0" x2="300.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="250.0" y="394.0" font-size="24" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">7/9</tspan></text>
<text x="330.0" y="366.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">B</tspan></text>
<line x1="200.0" y1="440.0" x2="300.0" y2="510.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="250.0" y="474.0" font-size="24" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="24.0">2/9</tspan></text>
<text x="330.0" y="526.0" font-size="44" text-anchor="middle" fill="#1f56a8" xml:space="preserve"><tspan font-size="44.0" font-style="italic">W</tspan></text>
<circle cx="330.0" cy="23.0" r="32.0" fill="none" stroke="#d9262c" stroke-width="2.5"/>
<rect x="300.0" y="145.0" width="60.0" height="255.0" fill="none" stroke="#8c8c8c" stroke-width="3"/>
<text x="420.0" y="40.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">B</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0"> ∩ </tspan><tspan font-size="34.0" font-style="italic">B</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">) = 7/10 · 6/9 = 0.47</tspan></text>
<text x="420.0" y="200.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">B</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0"> ∩ </tspan><tspan font-size="34.0" font-style="italic">W</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">) = 7/10 · 3/9 = 0.23</tspan></text>
<text x="420.0" y="360.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">W</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0"> ∩ </tspan><tspan font-size="34.0" font-style="italic">B</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">) = 3/10 · 7/9 = 0.23</tspan></text>
<text x="420.0" y="520.0" font-size="34" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-size="34.0" font-style="italic">P</tspan><tspan font-size="34.0">(</tspan><tspan font-size="34.0" font-style="italic">W</tspan><tspan dy="10.2" font-size="23.8">1</tspan><tspan dy="-10.2" font-size="34.0"> ∩ </tspan><tspan font-size="34.0" font-style="italic">W</tspan><tspan dy="10.2" font-size="23.8">2</tspan><tspan dy="-10.2" font-size="34.0">) = 3/10 · 2/9 = 0.07</tspan></text>
</svg>
