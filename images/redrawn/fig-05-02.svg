<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="'STIX Two Text','Times New Roman',Times,'Liberation Serif',serif">
<title id="title">Figure 5.2 Uniform distribution on [0, 1]</title>
<desc id="desc">Graph of the density y = f(x) of the uniform distribution on [0, 1]: a horizontal segment at height 1 from x = 0 to x = 1, and the value 0 elsewhere along the x-axis, with open circles at 0 and 1.</desc>
<rect width="1000" height="560" fill="#fff"/>
<line x1="170.0" y1="470.0" x2="810.0" y2="470.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="231.9" y1="521.6" x2="231.9" y2="40.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="748.1" y1="105.6" x2="748.1" y2="470.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="9 8"/>
<line x1="231.9" y1="105.6" x2="748.1" y2="105.6" stroke="#1f56a8" stroke-width="6"/>
<line x1="158.0" y1="470.0" x2="231.9" y2="470.0" stroke="#1f56a8" stroke-width="6"/>
<line x1="748.1" y1="470.0" x2="822.0" y2="470.0" stroke="#1f56a8" stroke-width="6"/>
<circle cx="231.9" cy="470.0" r="9.6" fill="#fff" stroke="#1f56a8" stroke-width="4.8"/>
<circle cx="748.1" cy="470.0" r="9.6" fill="#fff" stroke="#1f56a8" stroke-width="4.8"/>
<text x="218.4" y="116.1" font-size="30" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0">1</tspan></text>
<text x="218.4" y="512.0" font-size="30" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0">0</tspan></text>
<text x="748.1" y="512.0" font-size="30" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0">1</tspan></text>
<text x="810.0" y="70.0" font-size="30" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan font-size="30.0" font-style="italic">y</tspan><tspan font-size="30.0"> = </tspan><tspan font-size="30.0" font-style="italic">f</tspan><tspan font-size="30.0">(</tspan><tspan font-size="30.0" font-style="italic">x</tspan><tspan font-size="30.0">)</tspan></text>
</svg>
